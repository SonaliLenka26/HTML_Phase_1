<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Portal</title>
</head>

<body>

<header>
    <h1>Feedback Form</h1>

<nav>
    <ul>
        <li><a href="index.html">🏠 Home</a></li>
        <li><a href="profile.html">👤 Profile</a></li>
        <li><a href="course.html">📚 Courses</a></li>
        <li><a href="feedback.html">📝 Feedback</a></li>
        <li><a href="grade.html">📊 Grades</a></li>
        <li><a href="contact.html">📞 Contact</a></li>
    </ul>
</nav>
</header>

<hr>

<main>
    <h2>📝 Share Your Feedback</h2>
    <p>Please fill in the form below to share your thoughts about the courses and the portal.</p>

    <form action="/submit-feedback" method="post">

        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter Your Name">
        </div>

        <br>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter Your Email id">
        </div>

        <br>

        <div>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter Your Phone Number">
        </div>

        <br>

        <div>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="1" max="120" placeholder="Enter Your Age">
        </div>

        <br>

        <fieldset>
            <legend>Gender:</legend>
            <input type="radio" id="genderMale" name="gender" value="Male">
            <label for="genderMale">Male</label>

            <input type="radio" id="genderFemale" name="gender" value="Female">
            <label for="genderFemale">Female</label>

            <input type="radio" id="genderOther" name="gender" value="Other">
            <label for="genderOther">Other</label>
        </fieldset>

        <br>

        <div>
            <label for="course">Select Course:</label>
            <select id="course" name="course">
                <option value="">-- Choose a course --</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
            </select>
        </div>

        <br>

        <div>
            <label for="message">Your Feedback:</label>
            <p><textarea id="message" name="message" rows="5" cols="30"></textarea></p>
        </div>

        <div>
            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">Subscribe to newsletter and updates</label>
        </div>

        <div>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>

    </form>
</main>

<hr>

<footer>
    <p>&copy; 2026 Student Portal. All rights reserved.</p>
</footer>

</body>

</html>
