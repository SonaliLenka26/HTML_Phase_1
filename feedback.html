<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | Student Profile &amp; Course Portal</title>
</head>

<body>

<header>
    <h1>Feedback Form</h1>

    <nav>
        <ul>
            <li><a href="index.html">🏠 Home</a></li>
            <li><a href="profile.html">👤 Profile</a></li>
            <li><a href="course.html">📚 Courses</a></li>
            <li><a href="feedback.html">📝 Feedback</a></li>
            <li><a href="grade.html">📊 Grades</a></li>
            <li><a href="contact.html">📞 Contact</a></li>
        </ul>
    </nav>
</header>

<hr>

<main>
    <h2>📝 Share Your Feedback</h2>
    <p>Please fill in the form below to share your thoughts about the courses and the portal. Fields marked * are required.</p>

    <form>

        <p>
            <label for="name">Name:</label>
            <br>
            <input type="text" id="name" name="name">
        </p>

        <p>
            <label for="email">Email:</label>
            <br>
            <input type="email" id="email" name="email">
        </p>

        <p>
            <label for="phone">Phone:</label>
            <br>
            <input type="tel" id="phone" name="phone" maxlength="10">
        </p>

        <fieldset>
            <legend>Gender</legend>
            <input type="radio" id="genderMale" name="gender" value="Male">
            <label for="genderMale">Male</label>

            <input type="radio" id="genderFemale" name="gender" value="Female">
            <label for="genderFemale">Female</label>

            <input type="radio" id="genderOther" name="gender" value="Other">
            <label for="genderOther">Other</label>
        </fieldset>

        <p>
            <label for="course">Select Course</label>
            <br>
            <select id="course" name="course">
                <option value=""> Choose a course </option>
                <option value="html">HTML &amp; Web Fundamentals</option>
                <option value="dbms">Database Management Systems</option>
                <option value="maths">Mathematics in Computer Science</option>
                <option value="it">Foundations of IT</option>
            </select>
        </p>

        <p>
            <label for="message">Your Feedback</label>
        <br>
            <textarea id="message" name="message" rows="5" cols="30"></textarea>
        </p>

        <p>
            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">Subscribe to newsletter and updates</label>
        </p>

        <p>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </p>

    </form>
</main>

<hr>

<footer>
    <p>&copy; 2026 Student Portal. All rights reserved.</p>
</footer>

</body>

</html>
